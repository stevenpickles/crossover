[package]
name = "crossover-svc"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The service daemon is a Windows-only concept (ADR 0011). On other targets
# the binary still builds (tri-OS CI) but does nothing, so its dependencies —
# including the platform crate — are Windows-gated. This crate deliberately
# does NOT depend on crossover-core, -protocol, or -security: the LocalSystem
# process must not link any network, TLS, clipboard, or protocol-parsing code,
# so the "minimal launcher, no untrusted input" invariant (ADR 0011) is
# enforced by the dependency graph rather than by discipline.
[target.'cfg(windows)'.dependencies]
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
crossover-platform-windows = { workspace = true }

# Windows-only: stamp the icon and the version resource into crossover-svc.exe
# (build.rs), so the copy the SCM runs out of Program Files identifies itself
# in Explorer and to the packaging script without being executed. A *build*
# dependency, so the runtime isolation described in src/main.rs is untouched.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

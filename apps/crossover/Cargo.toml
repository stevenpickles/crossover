[package]
name = "crossover"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossover-core = { workspace = true }
crossover-platform = { workspace = true }
crossover-protocol = { workspace = true }
crossover-security = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Windows-only so non-Windows CI builds the app without the platform crate.
[target.'cfg(windows)'.dependencies]
crossover-platform-windows = { workspace = true }

[lints]
workspace = true

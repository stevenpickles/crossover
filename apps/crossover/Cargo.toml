[package]
name = "crossover"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossover-core = { workspace = true }
crossover-platform = { workspace = true }
# Depended on for all targets: off Windows it compiles as an empty shell
# with no-op stubs (and pulls in no `windows` crate — that is Windows-gated
# inside it), so the composition root can call platform hooks such as
# `set_process_dpi_awareness` / `restore_system_cursors` unconditionally.
crossover-platform-windows = { workspace = true }
crossover-protocol = { workspace = true }
crossover-security = { workspace = true }
# `config` for the `[layout]` section reader (ADR 0018, config schema v2):
# the shared model, its validation, and the `LayoutSection` shape this
# binary deserializes `[layout]` into. The writer half (`persist_layout`)
# is not called from here yet — that lands with the editor (feature/152).
crossover-topology = { workspace = true, features = ["config"] }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# `test-util` for tokio's paused clock: the periodic metrics schedule is
# about *when* something happens, and testing that against a real clock
# would mean a test that sleeps for a quarter of an hour. A dev dependency,
# so the shipped binary is unchanged.
[dev-dependencies]
# The in-memory secure storage the trust-policy tests read a trust store
# out of, without touching the machine's real one.
crossover-platform = { workspace = true, features = ["fakes"] }
# To build a well-formed `MonitorReport`/`PlacedMonitor` for the
# transitional decode-and-discard tests in `commands.rs` (feature/146):
# `crossover-protocol`'s wire types carry these model types by reference,
# so constructing one needs this crate's own constructors. Dev-only — the
# shipped binary never links it directly.
crossover-topology = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# Windows-only: compile the app icon into crossover.exe (build.rs). A build
# dependency, so it never enters the runtime graph.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

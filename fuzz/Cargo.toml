# Fuzz targets for every network-facing parse path (docs/TESTING.md §1.3).
# Excluded from the workspace (cargo-fuzz convention: its own profiles and
# nightly-only sanitizer builds); run with `cargo +nightly fuzz run <target>`.

[package]
name = "crossover-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.crossover-protocol]
path = "../crates/crossover-protocol"

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hello"
path = "fuzz_targets/hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_start"
path = "fuzz_targets/pairing_start.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_confirm"
path = "fuzz_targets/pairing_confirm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clipboard_data"
path = "fuzz_targets/clipboard_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clipboard_chunk"
path = "fuzz_targets/clipboard_chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clipboard_file_offer"
path = "fuzz_targets/clipboard_file_offer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clipboard_control"
path = "fuzz_targets/clipboard_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input"
path = "fuzz_targets/input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "monitor_topology"
path = "fuzz_targets/monitor_topology.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout_sync"
path = "fuzz_targets/layout_sync.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[package]
name = "crossover-platform-windows"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossover-platform = { workspace = true }

# Win32 bindings only when actually building for Windows; on other targets
# this crate compiles as an empty shell so tri-OS CI builds the workspace.
[target.'cfg(windows)'.dependencies]
# tracing: hook loss is an asynchronous event with no error path to
# surface through, and NFR-3 forbids a silent failure of an important
# state transition — the watchdog logs it at the moment of detection.
tracing = { workspace = true }
windows = { workspace = true }
windows-core = { workspace = true }

# tracing-subscriber only for the manual key-capture probe, which prints
# the per-key diagnostic (scan code, extended/injected flags, HID) to
# stderr; the library itself installs no subscriber.
[target.'cfg(windows)'.dev-dependencies]
tracing-subscriber = { workspace = true }

# The workspace forbids unsafe_code (NFR-6). This crate is the designated
# exception: Win32 FFI requires `unsafe`. The relaxation is local and
# deliberate — unsafe stays minimized, isolated here, documented with
# SAFETY comments, and covered by platform tests that run on Windows CI
# (docs/SPECIFICATION.md NFR-6, docs/TESTING.md §1.6). The clippy tables
# mirror the workspace policy, which cannot be partially inherited.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

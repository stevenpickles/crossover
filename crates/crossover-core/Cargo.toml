[package]
name = "crossover-core"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossover-platform = { workspace = true }
crossover-protocol = { workspace = true }
crossover-security = { workspace = true }
# The drawn layout model (ADR 0018), for the crossing-span derivation in
# `crossing`. The DEFAULT graph only — `serde` + `thiserror`, both already
# here — because the `config` feature's `toml_edit`/`serde_json` belong to
# the worker and the editor, not to a crate full of state machines.
crossover-topology = { workspace = true }

# Layout convergence (ADR 0018): when the `(revision, origin)` ordering key
# ties, the tiebreak is the SHA-256 of the postcard encoding of the layout's
# monitor list, so `layout_sync` needs both. Neither is new to this crate's
# graph — `crossover-protocol` and `crossover-security` already carry them —
# and neither may go into `crossover-topology`, whose dependency set ADR
# 0018 fixes at `serde` + `thiserror` so the GUI editor links the model
# without a hash implementation it never uses.
postcard = { workspace = true }
sha2 = { workspace = true }

# The net module (docs/ARCHITECTURE.md §3.1: networking folded into
# core::net until a second transport appears). State machines stay pure;
# I/O is confined to net.
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
crossover-platform = { workspace = true, features = ["fakes"] }
proptest = { workspace = true }
# `test-util` gives the paused clock the edge-transfer tests use to drive a
# polling detector deterministically instead of sleeping on a real one.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# Disconnect diagnostics are *log lines*, so the tests that keep them
# honest read the emitted line rather than an internal value: a subscriber
# capturing into a buffer is the only way to assert what a maintainer will
# actually see in the file (docs/ARCHITECTURE.md §10).
tracing-subscriber = { workspace = true }

[lints]
workspace = true

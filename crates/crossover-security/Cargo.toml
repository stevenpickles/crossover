[package]
name = "crossover-security"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Consumes the SecureStorage trait for private key material at rest.
crossover-platform = { workspace = true }

# Identity (ADR 0003): Ed25519 keypair, SPKI SHA-256 fingerprint. Chosen
# over an rcgen/ring keypair here to stay pure-Rust with no native build
# steps; the TLS slice converts to PKCS#8 for rustls/rcgen when needed.
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
# At-rest identity blob encoding. Storage format is versioned explicitly
# (format_version field), independent of the wire protocol version.
postcard = { workspace = true }
# TLS layer (ADR 0003): rcgen wraps the identity key in a semantics-free
# self-signed cert; rustls carries it with custom SPKI-pinning verifiers;
# x509-parser extracts the peer's SPKI for fingerprinting.
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
# Pairing ceremony (ADR 0002): SPAKE2 keyed by the one-time code, HMAC
# confirmation over the transcript.
hmac = { workspace = true }
spake2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
crossover-platform = { workspace = true, features = ["fakes"] }

[lints]
workspace = true

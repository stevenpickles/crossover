[workspace]
members = [
    "apps/crossover",
    "apps/crossover-svc",
    "crates/crossover-core",
    "crates/crossover-platform",
    "crates/crossover-platform-windows",
    "crates/crossover-protocol",
    "crates/crossover-security",
    "tools/test-peer",
]
# cargo-fuzz convention: the fuzz crate lives outside the workspace (own
# profiles, nightly-only sanitizer builds).
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
# One version for every crate, bumped once per release. Kept here rather
# than repeated in eight manifests because `build_identity.rs` reads each
# crate's own CARGO_PKG_VERSION: if the two binaries ever disagreed, they
# would report different versions and the packaging script's consistency
# check would reject the build — a drift that is easy to create and
# tedious to diagnose.
#
# Bumped immediately *after* a release, not before the next one. A build
# made after v0.1.0 shipped is `0.2.0-dev.N`, which sorts above 0.1.0, so it
# installs as an upgrade; leaving it at 0.1.0 would make every development
# build a *pre-release of the version already installed* and therefore
# un-upgradeable.
version = "0.2.0"
# Nothing here is published to crates.io: this is one application in one
# repository, and the crate split exists for internal boundaries
# (docs/ARCHITECTURE.md §3), not distribution. Declaring it prevents an
# accidental `cargo publish` and lets dependency policy distinguish our
# path dependencies from real wildcard requirements.
publish = false
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/stevenpickles/crossover"

[workspace.dependencies]
crossover-core = { path = "crates/crossover-core" }
crossover-platform = { path = "crates/crossover-platform" }
crossover-platform-windows = { path = "crates/crossover-platform-windows" }
crossover-protocol = { path = "crates/crossover-protocol" }
crossover-security = { path = "crates/crossover-security" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `alloc` is explicit: in 3.0 the pkcs8 feature no longer implies it, and
# the DER *encode* traits (which produce the SPKI bytes our identity is
# pinned to, ADR 0003) live behind it.
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
getrandom = "0.4"
hmac = "0.13"
# default-features = false drops postcard's heapless-cas default, which
# pulls the unmaintained atomic-polyfill (RUSTSEC advisory) through
# heapless 0.7. Crossover is a std application and never needed it.
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
# ring backends (not aws-lc-rs): pure prebuilt-asm builds on all three CI
# OSes with no CMake/NASM toolchain requirements.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# RustCrypto PAKEs implementation (ADR 0002 dependency evaluation: active
# org maintenance, MIT/Apache-2.0, pure Rust, transitive deps already in
# tree via the dalek family). Stable 0.4 line, not the 0.5 pre-release.
spake2 = "0.4"
thiserror = "2"
# Human-editable startup configuration file (Phase 6). default-features off
# drops the `display` half — the config is read, never written. `serde` is
# explicit because 1.0 stopped implying it from `parse`, and `toml::from_str`
# lives behind it. Held at 1.x so it stays the single TOML implementation in
# the tree: winresource's build script pulls 1.x regardless.
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
# Rolling file logs for the (often headless, service-launched) worker.
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.18"
windows = { version = "0.62", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"

# `unsafe_code = "forbid"` enforces NFR-6 (docs/SPECIFICATION.md). Platform
# crates may later relax it locally with documented justification.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

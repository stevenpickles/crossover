[workspace]
members = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/stevenpickles/crossover"

# `unsafe_code = "forbid"` enforces NFR-6 (docs/SPECIFICATION.md). Platform
# crates may later relax it locally with documented justification.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace]
members = [
    "apps/crossover",
    "crates/crossover-core",
    "crates/crossover-platform",
    "crates/crossover-platform-windows",
    "crates/crossover-protocol",
    "crates/crossover-security",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/stevenpickles/crossover"

[workspace.dependencies]
crossover-core = { path = "crates/crossover-core" }
crossover-platform = { path = "crates/crossover-platform" }
crossover-platform-windows = { path = "crates/crossover-platform-windows" }
crossover-protocol = { path = "crates/crossover-protocol" }
crossover-security = { path = "crates/crossover-security" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
getrandom = "0.3"
postcard = { version = "1", features = ["use-std"] }
proptest = "1"
# ring backends (not aws-lc-rs): pure prebuilt-asm builds on all three CI
# OSes with no CMake/NASM toolchain requirements.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
zeroize = "1"

# `unsafe_code = "forbid"` enforces NFR-6 (docs/SPECIFICATION.md). Platform
# crates may later relax it locally with documented justification.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
